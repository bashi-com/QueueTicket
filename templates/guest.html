<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイページ</title>
    <script src="/static/poll.js" defer></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #f4f4f4; }
        .ticket-card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .number { font-size: 4rem; font-weight: bold; color: #333; margin: 10px 0; }
        .status { font-size: 1.5rem; font-weight: bold; padding: 10px; border-radius: 8px; color: white; }
        .status-waiting { background-color: #2196F3; }
        .status-called { background-color: #FF9800; animation: flash 1s infinite; }
        .status-absent { background-color: #FF9800; }
        .status-returned { background-color: #4CAF50; }
        .status-completed { background-color: #9E9E9E; }
        .poll-error { background: #fff3cd; color: #664d03; padding: 12px; border-radius: 8px; }
        #enable-sound { margin: 1rem 0; padding: 12px; border: 0; border-radius: 8px; background: #e3f2fd; color: #1976d2; font-size: 1rem; cursor: pointer; }
        .btn-return-guest {
            width: 100%;
            margin-top: 12px;
            padding: 16px;
            font-size: 1.3rem;
            font-weight: bold;
            background: #1976D2;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .btn-return-guest:disabled { opacity: 0.6; cursor: wait; }
        .info { margin-top: 20px; color: #666; }
        @keyframes flash { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    <div id="guest-ticket" class="ticket-card" data-poll-url="/guest/{{ ticket.id }}/content" data-poll-interval="{{ interval }}">
        {% include "guest_content.html" %}
    </div>
    <p data-poll-updated-for="guest-ticket" aria-live="polite">最終更新 --:--:--</p>
    <p data-poll-error-for="guest-ticket" class="poll-error" role="alert" hidden></p>
    <button id="enable-sound" type="button">🔔 呼出時に音とバイブで知らせる（タップしてください）</button>
    <p class="info">整理番号を控えておいてください。この画面を閉じても、URL を再度開けば確認できます</p>
</body>
</html>
